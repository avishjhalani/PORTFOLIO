<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background rounded card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#030712" stroke="url(#neonGrad)" stroke-width="2.5" />
  
  <!-- Monogram AJ -->
  <text x="29" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="900" letter-spacing="-1" text-anchor="middle" fill="url(#neonGrad)" filter="url(#glow)">AJ</text>
  
  <!-- Glowing Dot -->
  <circle cx="48" cy="40" r="3.5" fill="#00f5ff" filter="url(#glow)" />
</svg>
